        conditions:
        - macro: '{#NAME}'
          value: '{$NVIDIA.NAME.MATCHES}'
        - macro: '{#NAME}'
          value: '{$NVIDIA.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#UUID}'
          value: '{$NVIDIA.UUID.MATCHES}'
        - macro: '{#UUID}'
          value: '{$NVIDIA.UUID.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
