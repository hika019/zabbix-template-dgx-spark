zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 461888b322de497597d6da7d8254db7c
    name: Templates/Custom
  templates:
  - uuid: 5aaee3b5e0ec4f1fb9baf4b4481622e8
    template: DGX Spark GB10 by Zabbix agent 2
    name: DGX Spark GB10 by Zabbix agent 2
    description: 'NVIDIA DGX Spark (GB10) 用。公式「Nvidia by Zabbix agent 2」のGPUメトリクス(NVML)に、ACPI thermal zone 0-6 の温度と /proc/meminfo によるユニファイドメモリを加えたもの。GB10で取得できない FB memory / PCIe throughput は除外。公式Nvidiaテンプレートとは同時にリンクしないこと。要: Zabbix agent 2 + Nvidia プラグイン。'
    groups:
    - name: Templates/Custom
    items:
    - uuid: 23fd2391023a4b649221e533c0b5f900
      name: Number of devices
      key: nvml.device.count
      delay: 1h
      description: 'Retrieves the number of compute devices in the system. A compute device is a single GPU.

        For all Nvidia products.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: nvidia
      triggers:
      - uuid: 1d7b3f1eb3e448188c896c700a003335
        expression: change(/DGX Spark GB10 by Zabbix agent 2/nvml.device.count) <> 0
        name: 'Nvidia: Number of devices has changed'
        event_name: 'Nvidia: Number of devices on {HOST.HOST} has changed.'
        opdata: 'current value: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Number of devices has changed. Check if this was intentional.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 7caa66c511e44ef18c49ed55d0c48bcb
      name: Get devices
      key: nvml.device.get
      delay: 1h
      history: '0'
      value_type: TEXT
      description: Retrieves a list of Nvidia devices in the system.
      tags:
      - tag: component
        value: nvidia
      - tag: component
        value: raw
    - uuid: 128884e34b8d495ebb58d5d587058702
      name: Driver version
      key: nvml.system.driver.version
      delay: 1h
      value_type: CHAR
      description: 'Retrieves the version of the system''s graphics driver.

        For all Nvidia products.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: nvidia
      triggers:
      - uuid: b730263fcad64f5eaf3399ac6171c0c3
        expression: change(/DGX Spark GB10 by Zabbix agent 2/nvml.system.driver.version) <> 0
        name: 'Nvidia: Driver version has changed'
        event_name: 'Nvidia: Driver version on {HOST.HOST} has changed.'
        opdata: 'current value: {ITEM.LASTVALUE1}'
        priority: INFO
        description: 'Driver version has changed.

          Check the Nvidia website for the specific driver version: https://www.nvidia.com/en-us/drivers/

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: d531713a85a74f67a49b3e8589e1db61
      name: NVML library version
      key: nvml.version
      delay: 1h
      value_type: CHAR
      description: 'Retrieves the version of the NVML library.

        For all Nvidia products.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: nvidia
      triggers:
      - uuid: 00ffa5acaa0e4736b89d13b990d11d0b
        expression: change(/DGX Spark GB10 by Zabbix agent 2/nvml.version) <> 0
        name: 'Nvidia: NVML library has changed'
        event_name: 'Nvidia: NVML library on {HOST.HOST} has changed.'
        opdata: 'current value: {ITEM.LASTVALUE1}'
        priority: INFO
        description: 'NVML library version has changed.

          Check the changelog for details: https://docs.nvidia.com/deploy/nvml-api/change-log.html

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - delay: 15s
      description: ACPI thermal zone TSOC (/sys/class/thermal/thermal_zone0)。番号とACPI名の対応は dmesg | grep "Thermal Zone" で要確認。
      history: 31d
      key: vfs.file.contents[/sys/class/thermal/thermal_zone0/temp]
      name: 'Temp: SoC (TSOC/zone0)'
      preprocessing:
      - parameters:
        - (-?\d+)
        - \1
        type: REGEX
      - parameters:
        - '0.001'
        type: MULTIPLIER
      tags:
      - tag: component
        value: temperature
      - tag: sensor
        value: TSOC
      - tag: priority
        value: main
      trends: 365d
      triggers:
      - description: 熱落ち(電源断)の直前域。即時発報。
        expression: last(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp])>{$SPARK.TEMP.HIGH:"zone0"}
        manual_close: 'YES'
        name: 'SoC温度が危険域 (zone0): {ITEM.LASTVALUE1}'
        priority: HIGH
        recovery_expression: max(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)<{$SPARK.TEMP.HIGH:"zone0"}-{$SPARK.TEMP.HYST}
        recovery_mode: RECOVERY_EXPRESSION
        tags:
        - tag: scope
          value: notice
        uuid: a50e4b8d9b084abea992c1fedca09253
      - dependencies:
        - expression: last(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp])>{$SPARK.TEMP.HIGH:"zone0"}
          name: 'SoC温度が危険域 (zone0): {ITEM.LASTVALUE1}'
          recovery_expression: max(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)<{$SPARK.TEMP.HIGH:"zone0"}-{$SPARK.TEMP.HYST}
        description: 1分間しきい値を超え続けた。
        expression: min(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)>{$SPARK.TEMP.WARN:"zone0"}
        manual_close: 'YES'
        name: 'SoC温度が高い (zone0): {ITEM.LASTVALUE1}'
        priority: WARNING
        recovery_expression: max(/DGX Spark GB10 by Zabbix agent 2/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],2m)<{$SPARK.TEMP.WARN:"zone0"}-{$SPARK.TEMP.HYST}
        recovery_mode: RECOVERY_EXPRESSION
        tags:
        - tag: scope
          value: notice
        uuid: efe4d1be56cb4b2bbaef0a86ee8149e9
      units: °C
      uuid: e0ed2f8225794795b493a7ca9902274c
      value_type: FLOAT
