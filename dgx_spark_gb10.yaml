    - uuid: 8aee4d9efb304f28a681b1632e86a920
      name: 'Unified memory: meminfo raw'
      key: vfs.file.contents[/proc/meminfo]
      delay: 30s
      history: '0'
      value_type: TEXT
      description: /proc/meminfo。GB10はCPUとGPUがメモリを共有するため、NVMLのFBメモリの代わりにこれを使う。
      tags:
      - &id001
        tag: component
        value: memory
      - tag: component
        value: raw
    - uuid: dc2434ae0d834220bdc16c2012f5e0f8
      name: 'Unified memory: total'
      type: DEPENDENT
      key: spark.memory.total
      history: 31d
      trends: 365d
      units: B
      description: MemTotal
      preprocessing:
      - type: REGEX
        parameters:
        - MemTotal:\s+(\d+)
        - \1
      - type: MULTIPLIER
        parameters:
        - '1024'
      master_item:
        key: vfs.file.contents[/proc/meminfo]
      tags: &id002
      - *id001
    - uuid: 408130312cd44afd941bc0256109ce27
      name: 'Unified memory: available'
      type: DEPENDENT
      key: spark.memory.available
      history: 31d
      trends: 365d
      units: B
      description: MemAvailable
      preprocessing:
      - type: REGEX
        parameters:
        - MemAvailable:\s+(\d+)
        - \1
      - type: MULTIPLIER
        parameters:
        - '1024'
      master_item:
        key: vfs.file.contents[/proc/meminfo]
      tags: *id002
    - uuid: 5e83f589ad74420984f7a55e6c7b85a3
      name: 'Unified memory: page cache'
      type: DEPENDENT
      key: spark.memory.cached
      history: 31d
      trends: 365d
      units: B
      description: Cached
      preprocessing:
      - type: REGEX
        parameters:
        - Cached:\s+(\d+)
        - \1
      - type: MULTIPLIER
        parameters:
        - '1024'
      master_item:
        key: vfs.file.contents[/proc/meminfo]
      tags: *id002
    - uuid: 1861079f11134fffad66a19363a85c94
      name: 'Unified memory: used'
      type: CALCULATED
      key: spark.memory.used
      delay: 30s
      units: B
      params: last(//spark.memory.total)-last(//spark.memory.available)
      description: total - available（CPUとGPUの合計使用量）
      tags: *id002
    - uuid: 0a3a204b07644c93a7df0a78416c7ff0
      name: 'Unified memory: utilization'
      type: CALCULATED
      key: spark.memory.pused
      delay: 30s
      value_type: FLOAT
      units: '%'
      params: 100*(last(//spark.memory.total)-last(//spark.memory.available))/last(//spark.memory.total)
      tags: *id002
      triggers:
      - uuid: ef4137455862477da958e1c7fab87283
        expression: min(/DGX Spark GB10 by Zabbix agent 2/spark.memory.pused,5m)>{$SPARK.MEM.PUSED.WARN}
        name: 'ユニファイドメモリ使用率が高い: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: CPUとGPUで共有しているメモリが5分間しきい値を超えている。OOMで推論プロセスが落ちる前兆。
        tags:
        - tag: scope
          value: capacity
