zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 461888b322de497597d6da7d8254db7c
    name: Templates/Custom
  templates:
  - uuid: 0fd10a9a4906499f88ccef84f25f802a
    template: DGX Spark GB10 Thermal
    name: DGX Spark GB10 Thermal
    description: NVIDIA DGX Spark (GB10) の ACPI thermal zone 0-6 を vfs.file.contents で取得。nvidia-smi のGPU温度は実温度より低めに出る報告があるため、アラートはこちらに付ける。GPU使用率等は公式 Nvidia by Zabbix agent 2 を併用。
    groups:
    - name: Templates/Custom
    items:
    - uuid: 2155a582e1b744008b818738fd896ca4
      name: 'Temp: SoC (TSOC/zone0)'
      key: vfs.file.contents[/sys/class/thermal/thermal_zone0/temp]
      delay: 15s
      value_type: FLOAT
      units: °C
      history: 31d
      trends: 365d
      description: ACPI thermal zone TSOC (/sys/class/thermal/thermal_zone0)。番号とACPI名の対応は dmesg | grep "Thermal Zone" で要確認。
      preprocessing:
      - type: REGEX
        parameters:
        - (-?\d+)
        - \1
      - type: MULTIPLIER
        parameters:
        - '0.001'
      tags:
      - tag: component
        value: temperature
      - tag: sensor
        value: TSOC
      - tag: priority
        value: main
      triggers:
      - uuid: b08ea09c54b442e0baa72e97ae684464
        expression: last(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp])>{$SPARK.TEMP.HIGH:"zone0"}
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)<{$SPARK.TEMP.HIGH:"zone0"}-{$SPARK.TEMP.HYST}
        name: 'SoC温度が危険域 (zone0): {ITEM.LASTVALUE1}'
        priority: HIGH
        manual_close: 'YES'
        description: 熱落ち(電源断)の直前域。即時発報。
        tags:
        - tag: scope
          value: notice
      - uuid: 4ebecabf5b644b4e9fd875bf413c1baf
        expression: min(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)>{$SPARK.TEMP.WARN:"zone0"}
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],2m)<{$SPARK.TEMP.WARN:"zone0"}-{$SPARK.TEMP.HYST}
        name: 'SoC温度が高い (zone0): {ITEM.LASTVALUE1}'
        priority: WARNING
        manual_close: 'YES'
        description: 1分間しきい値を超え続けた。
        dependencies:
        - name: 'SoC温度が危険域 (zone0): {ITEM.LASTVALUE1}'
          expression: last(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp])>{$SPARK.TEMP.HIGH:"zone0"}
          recovery_expression: max(/DGX Spark GB10 Thermal/vfs.file.contents[/sys/class/thermal/thermal_zone0/temp],1m)<{$SPARK.TEMP.HIGH:"zone0"}-{$SPARK.TEMP.HYST}
        tags:
        - tag: scope
          value: notice
